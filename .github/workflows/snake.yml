name: Snake

# Draws the contribution graph as a snake (light and dark) and publishes it to the `output` branch,
# which the README reads from raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff4a1f&color_dots=#ebedf0,#ffd9cc,#ffa98f,#ff7a52,#e03a12
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4a1f&color_dots=#161b22,#3d1d14,#7a2d17,#c23c17,#ff4a1f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
